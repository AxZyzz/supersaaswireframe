name: Uptime

# Fallback uptime probe (T10.5): hits the readiness endpoint every 30 minutes
# and fails loudly (GitHub emails the repo owner) if the API is down or its
# DB/Redis are unreachable. Does nothing — and bills no minutes — until the
# repository variable UPTIME_URL is set (e.g. https://api.example.com).
# A dedicated pinger (1-minute checks + SMS) is still recommended for launch.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ vars.UPTIME_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health/ready
        env:
          URL: ${{ vars.UPTIME_URL }}
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o body.txt -w '%{http_code}' --max-time 15 "$URL/health/ready" || echo 000)
            if [ "$code" = "200" ]; then
              echo "up: $(cat body.txt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code $(cat body.txt 2>/dev/null)"
            sleep 20
          done
          echo "::error::$URL/health/ready failed 3 times"
          exit 1
