name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supersaas
          POSTGRES_PASSWORD: supersaas
          POSTGRES_DB: supersaas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supersaas -d supersaas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://supersaas_app:supersaas_app@localhost:5432/supersaas
      MIGRATE_DATABASE_URL: postgresql://supersaas:supersaas@localhost:5432/supersaas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrate
        run: npm run db:migrate -w apps/api

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present
