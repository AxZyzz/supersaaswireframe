[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expelly-agents"
version = "0.1.0"
description = "Expelly AI agents (Google ADK): Review analyst and Copywriter, served over A2A."
requires-python = ">=3.12"
# Exact pins: ADK, A2A and Agent Engine APIs change quickly. Bump on purpose, then rerun the tests.
dependencies = [
  "google-adk[a2a]==2.15.0",
  "a2a-sdk==1.3.1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.20"]
deploy = ["google-cloud-aiplatform[agent_engines,adk]>=1.112.0"]

[tool.setuptools.packages.find]
include = ["expelly_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
