# Builds the web image. _API_URL is the API's public https URL: the web app
# proxies /api/* to it (first-party cookies) and opens the websocket to it.
# Both are baked in at build time, so rebuild web if the API URL changes.
#   gcloud builds submit --region=asia-south1 --config deploy/cloudbuild-web.yaml \
#     --substitutions=_IMAGE=asia-south1-docker.pkg.dev/PROJECT_ID/supersaas/web:TAG,_API_URL=https://supersaas-api-PROJECT_NUMBER.asia-south1.run.app .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - API_PROXY_TARGET=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_API_PUBLIC_URL=${_API_URL}
      - -t
      - ${_IMAGE}
      - .
images: ["${_IMAGE}"]
